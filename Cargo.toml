[package]
name = "armv8-encode"
version = "0.2.2"
edition = "2021"

[dependencies]
# Binary container parsing for the `container` layer. Defaults pull in
# Wasm/PE/COFF support we don't need yet — keep the surface narrow and the
# build fast. `write_std` is included so tests can synthesize tiny in-memory
# Mach-O / ELF fixtures without committing binaries; production write
# support arrives with PR 4.
object = { version = "0.36", default-features = false, features = [
    "read_core",
    "write_std",
    "macho",
    "elf",
    "pe",
    "coff",
    "std",
] }

# x86 / x86_64 instruction decode + encode for the `isa::x86` layer.
# Default features pull in every formatter (gas/masm/nasm/fast_fmt) and the
# block encoder we don't use — we drive layout/widening through the crate's
# own rewrite pipeline, same as AArch64/ARMv7. Keep only decoder + encoder,
# instruction-info (for CFG flow-control classification), and the Intel
# formatter (for the `dump` example).
iced-x86 = { version = "1.21", default-features = false, features = [
    "decoder",
    "encoder",
    "block_encoder",
    "instr_info",
    "intel",
    "std",
] }

# DWARF parsing for function boundaries and source-line lifting on top of
# the container layer. `write` is included so tests can synthesize debug
# sections in-memory alongside `object::write` fixtures.
gimli = { version = "0.31", default-features = false, features = [
    "read",
    "write",
    "std",
] }
